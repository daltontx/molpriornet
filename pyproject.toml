[project]
name = "molpriornet"
authors = [{ name = "Dalton Tx", email = "science@daltontx.com" }]
dynamic = ["version"]
description = "Molecular Prior Networks: meta-learned few-shot molecular property prediction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "cheminformatics",
    "few-shot-learning",
    "meta-learning",
    "molecular-property-prediction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
]

# Everything the package and the scripts in scripts/ need. Two further
# packages are optional and imported only if present: mlflow (experiment
# tracking, see the extra below) and cloudpathlib (lets train.py write
# checkpoints to a cloud URI; install it with your backend, e.g.
# `pip install cloudpathlib[s3]`).
dependencies = [
    "loguru",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "rdkit>=2023.9.1",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "torch>=2.4",
]

[project.optional-dependencies]
# Optional experiment tracking in scripts/train.py, enabled by `experiment_name`.
mlflow = ["mlflow>=2.0"]

[project.urls]
homepage = "https://github.com/daltontx/molpriornet"
issues = "https://github.com/daltontx/molpriornet/issues"

[build-system]
requires = ["setuptools>=77.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
local_scheme = "dirty-tag"
version_scheme = "no-guess-dev"
version_file = "src/molpriornet/_version.py"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16",
]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
extend-select = [
    "I",    # Import sorting
    "ANN",  # Type annotations
    "D101", # Class missing docstring
    "D102", # Method missing docstring
    "D103", # Function missing docstring
    "D105", # Magic method missing docstring
    "D107", # Constructor missing docstring
    "W505", # Docstring line too long
]
